[package]
name = "many-produce"
version = "0.1.0"
description = "Local-first producing hub. No AI, no accounts, no cloud."
edition = "2021"
license = "MIT"

[lib]
name = "many_produce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
